
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倉庫バーコード読み取り</title>

<style>
body {
  font-family: sans-serif;
  background: #f3f5f7;
  padding: 18px;
}
.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
}
button {
  width: 100%;
  padding: 16px;
  margin: 8px 0;
  font-size: 18px;
  background: #2463a6;
  color: white;
  border: none;
  border-radius: 8px;
}
video {
  width: 100%;
  margin-top: 12px;
  background: black;
  border-radius: 8px;
}
#message {
  font-weight: bold;
  margin-top: 15px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="card">
<h2>📦 倉庫商品読み取り</h2>
<p>商品バーコードにスマホをかざしてください。</p>

<button id="start">カメラを起動する</button>

<video id="video" autoplay muted playsinline></video>

<button id="stop">カメラを停止</button>

<p id="message">読み取り待機中です</p>
</div>

<script type="module">
import {
  BrowserMultiFormatReader
} from "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm";

// Apps ScriptのURLは後で設定
const GAS_URL = "https://script.google.com/macros/s/AKfycbxwadxDYfwICAVT5F77aUKsS8DP6csFlHE4svCaaIgD8YPKLJpZzyimvzpC3GFyYBKV/exec";

const video = document.getElementById("video");
const message = document.getElementById("message");

let reader = null;
let controls = null;
let scanning = false;

async function startScan() {
  if (scanning) return;

  try {
    scanning = true;
    message.textContent = "カメラを起動しています...";

    reader = new BrowserMultiFormatReader();

    controls = await reader.decodeFromVideoDevice(
      undefined,
      video,
      (result, error) => {
        if (result && scanning) {
          const code = result.getText();

          scanning = false;

          if (controls) {
            controls.stop();
            controls = null;
          }

          message.textContent = "読み取り成功：" + code;

          if (GAS_URL) {
            window.location.href =
              GAS_URL + "?code=" + encodeURIComponent(code);
          }
        }
      }
    );

    if (scanning) {
      message.textContent =
        "商品にカメラをかざしてください";
    }

  } catch (e) {
    scanning = false;
    message.textContent =
      "カメラエラー：" + e.message;
  }
}

function stopScan() {
  scanning = false;

  if (controls) {
    controls.stop();
    controls = null;
  }

  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }

  message.textContent = "カメラを停止しました";
}

document.getElementById("start")
  .addEventListener("click", startScan);

document.getElementById("stop")
  .addEventListener("click", stopScan);

</script>
</body>
</html>
